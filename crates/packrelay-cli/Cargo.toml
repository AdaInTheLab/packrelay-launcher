[package]
name = "packrelay-cli"
description = "PackRelay launcher CLI — installs signed 7DTD mod packs from packrelay.cloud."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "packrelay"
path = "src/main.rs"

[dependencies]
packrelay-core = { path = "../packrelay-core" }

anyhow.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
tokio.workspace = true
