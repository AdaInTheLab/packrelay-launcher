[package]
name = "packrelay-app"
description = "PackRelay launcher (Tauri GUI). Wraps packrelay-core's install + verify modules in a desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix is the Tauri v2 convention — keeps the lib name
# distinct from the binary name so Windows linking doesn't collide.
# See https://github.com/rust-lang/cargo/issues/8519.
name = "packrelay_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
packrelay-core = { path = "../../crates/packrelay-core" }

anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Update channel — the plugin handles signature verification, download
# progress, and the platform-specific install hand-off (NSIS update on
# Windows, replace-in-place on macOS .app, AppImage swap on Linux).
# Pairs with `endpoints` + `pubkey` in tauri.conf.json. The signing
# private key is held in CI secrets (see docs/UPDATER.md).
tauri-plugin-updater = "2"
# Process plugin — exposes `relaunch()` to the frontend so we can
# restart cleanly after the updater has swapped in the new binary.
# Tauri's updater doesn't auto-restart on its own.
tauri-plugin-process = "2"
# Deep-link plugin — registers the `packrelay://` URL scheme so
# the browser can hand off an install request to the launcher
# via a single anchor click. Plugin handles per-platform scheme
# registration: Windows registry, macOS Info.plist, Linux .desktop.
# See https://v2.tauri.app/plugin/deep-link/ for the protocol.
tauri-plugin-deep-link = "2"
# Single-instance plugin — when the user launches PackRelay while
# it's already running (icon double-click, packrelay:// link clicked,
# launcher started during an active dev session), this plugin
# routes the new launch's args to the existing process and focuses
# its window instead of spawning a duplicate. Eliminates the
# duplicate-window UX bug tracked as Kitsunebi #221, plus the
# risk of two localStorage writers fighting over the same keys.
tauri-plugin-single-instance = { version = "2", features = [] }
tokio.workspace = true
