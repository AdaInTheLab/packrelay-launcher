# Manual diagnostic — exercises Windows code-signing OUTSIDE the Tauri
# bundler. Tauri swallows the signCommand's stdout/stderr (it logs it
# only at `debug` level and discards it entirely on failure), so the
# signed-release attempts only ever gave us "failed to run powershell".
#
# CRITICAL: the very first step that touches artifact-signing-cli runs
# COLD — no cached signing dlib, no cached `az login` token. The real
# release hits exactly that cold path, and an earlier version of this
# workflow masked the bug by warming the cache first. So the COLD
# sign-windows.ps1 run is step 1 here, and nothing else runs the CLI
# before it.
#
# Trigger: Actions tab -> "Signing smoke test" -> Run workflow.
# Delete this file once Windows signing is confirmed green.

name: Signing smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pin as release.yml so we're testing the real thing.
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked --version 0.11.0

      - name: Probe runner environment
        shell: pwsh
        run: |
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          Write-Host "az.cmd at CLI default path : $(Test-Path $az)"
          $signtoolDefault = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          Write-Host "signtool at CLI default    : $(Test-Path $signtoolDefault)"
          Write-Host "artifact-signing-cli cache : $(Test-Path "$env:USERPROFILE\.artifact-signing-cli")"
          Write-Host "azure token cache          : $(Test-Path "$env:USERPROFILE\.azure")"

      # THE faithful repro. sign-windows.ps1 invoked exactly as
      # tauri.conf.json's signCommand does — Windows PowerShell 5.1
      # (`powershell`, not `pwsh`), -File, with the artifact path —
      # and it is the FIRST thing to touch the CLI, so the cold dlib
      # download + cold `az login` happen inside the script, just
      # like in the release build. The child's streams are captured
      # via `$out = ... 2>&1`, reproducing Tauri's piped redirection.
      # Unlike Tauri, we then PRINT $out, so the failure is visible.
      - name: Exercise sign-windows.ps1 COLD (the Tauri way)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          Copy-Item "$env:USERPROFILE\.cargo\bin\artifact-signing-cli.exe" .\smoke-script.exe
          Write-Host "=== invoking sign-windows.ps1 via Windows PowerShell 5.1 ==="
          $out = powershell -ExecutionPolicy Bypass -File .\app\src-tauri\sign-windows.ps1 ".\smoke-script.exe" 2>&1
          $code = $LASTEXITCODE
          Write-Host "=== captured output (stdout + stderr) ==="
          $out | ForEach-Object { Write-Host $_ }
          Write-Host "=== end captured output ==="
          Write-Host "sign-windows.ps1 exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Verify the signature
        shell: pwsh
        run: |
          Get-AuthenticodeSignature .\smoke-script.exe |
            Select-Object Status, StatusMessage, SignerCertificate | Format-List
