# Manual diagnostic — exercises Windows code-signing OUTSIDE the Tauri
# bundler. Tauri swallows the signCommand's stdout/stderr and only
# reports a generic "failed to run powershell", so the first signed
# release (v0.1.9) gave us nothing to debug from. Two checks here:
#
#   1. `artifact-signing-cli` straight ~ proves Azure / SP / cert
#      profile work.
#   2. `sign-windows.ps1` invoked the way Tauri invokes it ~ Windows
#      PowerShell 5.1, output captured through a pipe ~ which is what
#      actually broke v0.1.9 (redirected native stderr + Stop = throw).
#
# Trigger: Actions tab -> "Signing smoke test" -> Run workflow.
# Delete this file once Windows signing is confirmed green.

name: Signing smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pin as release.yml so we're testing the real thing.
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked --version 0.11.0

      # The CLI hard-codes default paths for az.cmd and signtool.exe
      # (the latter with a specific SDK build number). Confirm what the
      # runner actually has before blaming Azure.
      - name: Probe runner environment
        shell: pwsh
        run: |
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          Write-Host "az.cmd at CLI default path : $(Test-Path $az)"
          $signtoolDefault = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          Write-Host "signtool at CLI default    : $(Test-Path $signtoolDefault)"

      # Check 1 — CLI straight. Output is NOT routed through Tauri, so
      # any 403 / role / auth / signtool error lands directly here.
      - name: Sign a throwaway binary (CLI direct)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Copy-Item "$env:USERPROFILE\.cargo\bin\artifact-signing-cli.exe" .\smoke-direct.exe
          & artifact-signing-cli `
            --endpoint "${{ secrets.AZURE_ENDPOINT }}" `
            --account "${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}" `
            --certificate "${{ secrets.AZURE_CERT_PROFILE_NAME }}" `
            .\smoke-direct.exe
          Write-Host "CLI exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Check 2 — the real plumbing. Invoke sign-windows.ps1 byte-for-
      # byte the way tauri.conf.json's signCommand does: Windows
      # PowerShell 5.1 (`powershell`, not `pwsh`), -File, quoted path.
      # Capturing the child's output into a variable redirects its
      # streams through a pipe ~ the exact condition under which 5.1
      # promotes native stderr to terminating errors. If the script's
      # ErrorActionPreference fix works, this exits 0.
      - name: Exercise sign-windows.ps1 (the Tauri way)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          Copy-Item "$env:USERPROFILE\.cargo\bin\artifact-signing-cli.exe" .\smoke-script.exe
          $out = powershell -ExecutionPolicy Bypass -File .\app\src-tauri\sign-windows.ps1 ".\smoke-script.exe" 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          Write-Host "sign-windows.ps1 exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Verify both signatures
        shell: pwsh
        run: |
          foreach ($f in @(".\smoke-direct.exe", ".\smoke-script.exe")) {
            Write-Host "--- $f ---"
            Get-AuthenticodeSignature $f |
              Select-Object Status, StatusMessage, SignerCertificate | Format-List
          }
