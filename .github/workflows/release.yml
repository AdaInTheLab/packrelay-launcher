# Builds the Tauri launcher for Windows / macOS / Linux on every
# tag push matching v*, uploads the bundles to a GitHub Release.
#
# Triggered by:   git tag v0.1.0 && git push --tags
#
# Outputs (per platform, in the release):
#   - Windows: PackRelay_<version>_x64-setup.exe (NSIS) + .msi
#   - macOS:   PackRelay.app.tar.gz + .dmg (universal target, both arches)
#   - Linux:   .AppImage + .deb
#
# Windows code-signing via Azure Trusted Signing — see docs/SIGNING.md
# for the one-time setup walkthrough. When the secrets and repo
# variables listed below are present:
#
#   * `cargo install artifact-signing-cli` step provisions the CLI
#   * tauri-action invokes it via tauri.conf.json's bundle.windows.signCommand
#   * each .exe / .msi artifact is signed before release upload
#
# When the secrets are absent (e.g. PR builds, forks, local-dev runs),
# `sign-windows.ps1` gracefully no-ops and the build still succeeds —
# just produces an unsigned binary that triggers SmartScreen on
# first run. macOS + Linux artifacts are untouched.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger lets us cut a "test" release without bumping the
  # tag — useful for verifying the workflow itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal — one DMG that runs on both Apple Silicon
          # and Intel. Slightly slower to build than a single-arch
          # build but produces one artifact instead of two.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal needs both targets present even though
          # the rust-toolchain action only installs the host target
          # by default.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry + target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        # Tauri 2's Linux runtime deps. Keep the ayatana fork — the
        # older libappindicator3-dev *conflicts* with it (one is the
        # GTK upstream, the other the Ubuntu/Mate fork), so listing
        # both made apt refuse the whole install. Ayatana is what
        # Tauri actually compiles against.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      # Provision Levminer's artifact-signing-cli on Windows runners
      # so tauri.conf.json's signCommand can invoke it during the
      # bundle phase. The CLI wraps signtool.exe + the Microsoft
      # signing dlib — canonical community tooling for Tauri + Azure
      # Artifact Signing. Pinned because the CLI's interface has
      # evolved across versions.
      #
      # Crate note: this tool was published as `trusted-signing-cli`
      # through 0.9.x; at 0.10.0 it was renamed `artifact-signing-cli`
      # (binary name follows). We track the current name + version.
      #
      # When AZURE_* secrets aren't set, this CLI still gets
      # installed but sign-windows.ps1 short-circuits before
      # calling it — no Azure connection attempted.
      - name: Install artifact-signing-cli (Windows only)
        if: matrix.platform == 'windows-latest'
        run: cargo install artifact-signing-cli --locked --version 0.11.0

      - name: Build + upload via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing secrets — see docs/UPDATER.md for the
          # one-time keypair-generation walkthrough. When these are
          # set, tauri-action:
          #   - signs each platform bundle with the private key
          #   - generates a `latest.json` describing the release
          #   - uploads it alongside the binaries
          # The launcher's tauri.conf.json `endpoints` points at
          # the latest release's `latest.json` URL, and the bundled
          # `pubkey` verifies signatures at install time.
          # When unset, tauri-action skips signing — releases still
          # publish but in-app auto-update is a no-op.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization — see docs/NOTARIZATION.md for the
          # one-time cert export + secrets walkthrough. When ALL
          # six secrets below are set, tauri-action:
          #   1. Imports the .p12 cert into a temporary keychain
          #      using APPLE_SIGNING_IDENTITY as the codesign-find key.
          #   2. Codesigns the .app + .dmg bundles.
          #   3. Submits to Apple's notary service via notarytool
          #      using APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID.
          #   4. Staples the notarization ticket to the .dmg.
          # When any are unset, codesign + notarize skip silently
          # and macOS users get the "right-click → Open" warning
          # on first launch (the existing pre-notarization state).
          # Linux + Windows jobs ignore these env vars regardless.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing via Azure Trusted Signing — see
          # docs/SIGNING.md for the one-time setup. Only consumed
          # by sign-windows.ps1 (invoked via tauri.conf.json's
          # bundle.windows.signCommand). When AZURE_CLIENT_SECRET
          # is unset, sign-windows.ps1 short-circuits and the
          # Windows artifact ships unsigned (the existing v0.1.x
          # behavior). All six values live in repo Secrets ~ the
          # last three (endpoint / account / profile name) aren't
          # sensitive, but keeping them as Secrets alongside the
          # real ones avoids a secrets-vs-variables split and the
          # `${{ vars.* }}` empty-string trap when only one tab is
          # populated.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        with:
          # The Tauri app lives in app/, not at the repo root, so
          # the action needs the project path to find tauri.conf.json.
          projectPath: app
          # __VERSION__ gets replaced with the version pulled from
          # tauri.conf.json. Keeps the release name in sync with
          # the actual build number without us hand-editing it.
          tagName: ${{ github.ref_name }}
          releaseName: "PackRelay Launcher ${{ github.ref_name }}"
          releaseBody: |
            Pre-built binaries for the PackRelay launcher.

            Every binary attached to this release is built by
            GitHub Actions directly from this repo's source. SHA-256
            hashes appear on packrelay.cloud/download — verify
            before running if you'd like.

            **Windows:** when code-signing is configured the binary
            is signed via Azure Trusted Signing (Microsoft attested
            publisher). When it isn't, you may see a SmartScreen
            prompt on first run — see
            https://packrelay.cloud/docs/windows-first-run for
            details on the warning and how to verify the binary.

            **macOS:** the .dmg is signed + notarized. Open
            normally. (Older v0.1.x builds that pre-date notarization
            need right-click → Open the first time.)

            See the README for what's in this release.
          # Mark every release as a draft so we get a chance to
          # paste real changelog notes before publishing. Cut the
          # draft once the binaries finish uploading.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's bundler swallows the signCommand's output and only
      # reports "failed to run powershell" on failure. sign-windows.ps1
      # mirrors every milestone (and the full artifact-signing-cli
      # output) into a log file; dump it here so a failed Windows
      # signing step is actually diagnosable. `always()` so it runs
      # even when the build step above failed. Temporary diagnostic ~
      # can be dropped once Windows signing is confirmed stable.
      - name: Dump Windows signing log
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "packrelay-sign-windows.log"
          if (Test-Path $log) {
            Write-Host "===== packrelay-sign-windows.log ====="
            Get-Content -LiteralPath $log
            Write-Host "===== end of log ====="
          } else {
            Write-Host "no sign-windows log at $log - the script never started"
          }
