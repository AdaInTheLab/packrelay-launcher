# Builds the Tauri launcher for Windows / macOS / Linux on every
# tag push matching v*, uploads the bundles to a GitHub Release.
#
# Triggered by:   git tag v0.1.0 && git push --tags
#
# Outputs (per platform, in the release):
#   - Windows: PackRelay_<version>_x64-setup.exe (NSIS) + .msi
#   - macOS:   PackRelay.app.tar.gz + .dmg (universal target, both arches)
#   - Linux:   .AppImage + .deb
#
# The Windows build is unsigned today — SmartScreen + Safe Browsing
# will warn on first run until we get a code-signing cert wired in.
# When that lands, add TAURI_SIGNING_PRIVATE_KEY + the Windows
# cert env vars to the secrets and tauri-action picks them up
# automatically.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger lets us cut a "test" release without bumping the
  # tag — useful for verifying the workflow itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal — one DMG that runs on both Apple Silicon
          # and Intel. Slightly slower to build than a single-arch
          # build but produces one artifact instead of two.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal needs both targets present even though
          # the rust-toolchain action only installs the host target
          # by default.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry + target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        # Tauri 2's Linux runtime deps. Keep the ayatana fork — the
        # older libappindicator3-dev *conflicts* with it (one is the
        # GTK upstream, the other the Ubuntu/Mate fork), so listing
        # both made apt refuse the whole install. Ayatana is what
        # Tauri actually compiles against.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Build + upload via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing secrets — see docs/UPDATER.md for the
          # one-time keypair-generation walkthrough. When these are
          # set, tauri-action:
          #   - signs each platform bundle with the private key
          #   - generates a `latest.json` describing the release
          #   - uploads it alongside the binaries
          # The launcher's tauri.conf.json `endpoints` points at
          # the latest release's `latest.json` URL, and the bundled
          # `pubkey` verifies signatures at install time.
          # When unset, tauri-action skips signing — releases still
          # publish but in-app auto-update is a no-op.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarization — see docs/NOTARIZATION.md for the
          # one-time cert export + secrets walkthrough. When ALL
          # six secrets below are set, tauri-action:
          #   1. Imports the .p12 cert into a temporary keychain
          #      using APPLE_SIGNING_IDENTITY as the codesign-find key.
          #   2. Codesigns the .app + .dmg bundles.
          #   3. Submits to Apple's notary service via notarytool
          #      using APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID.
          #   4. Staples the notarization ticket to the .dmg.
          # When any are unset, codesign + notarize skip silently
          # and macOS users get the "right-click → Open" warning
          # on first launch (the existing pre-notarization state).
          # Linux + Windows jobs ignore these env vars regardless.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # The Tauri app lives in app/, not at the repo root, so
          # the action needs the project path to find tauri.conf.json.
          projectPath: app
          # __VERSION__ gets replaced with the version pulled from
          # tauri.conf.json. Keeps the release name in sync with
          # the actual build number without us hand-editing it.
          tagName: ${{ github.ref_name }}
          releaseName: "PackRelay Launcher ${{ github.ref_name }}"
          releaseBody: |
            Pre-built binaries for the PackRelay launcher.

            **Windows users:** the binary isn't yet code-signed, so
            Windows SmartScreen will flag it as an "unrecognized
            app" on first run. Click **More info** → **Run anyway**.
            The launcher is open source — every binary attached to
            this release is built by GitHub Actions directly from
            this repo's source.

            **macOS users:** the .dmg is signed + notarized — open
            normally. (If you happen to land on an older v0.1.x
            release that pre-dates this, you'll need to right-click
            → Open the first time.)

            See the README for what's in this release.
          # Mark every release as a draft so we get a chance to
          # paste real changelog notes before publishing. Cut the
          # draft once the binaries finish uploading.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
