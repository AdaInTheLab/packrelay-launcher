[package]
name = "packrelay-launcher"
version = "0.1.0"
edition = "2021"
description = "PackRelay launcher — installs signed 7DTD mod packs from packrelay.cloud."
license = "MIT"
publish = false

[[bin]]
name = "packrelay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
# Smaller, faster cold-start binary. The launcher is CPU-bound on
# SHA-256 only, so size > speed on the rest of the code.
lto = true
codegen-units = 1
strip = true
