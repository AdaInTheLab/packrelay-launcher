[workspace]
members = [
    "crates/packrelay-core",
    "crates/packrelay-cli",
    "app/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.4"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
# Smaller, faster cold-start binary. The launcher is CPU-bound on
# SHA-256 only, so size > speed on the rest of the code.
lto = true
codegen-units = 1
strip = true
